# Prevent the kernel DVB drivers from claiming the RTL-SDR dongle before
# librtlsdr can open it. Installed by the ats-mini-controller .deb/.rpm or
# install.sh. Reboot (or `modprobe -r` each module) after installing.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832_sdr
blacklist rtl2832
blacklist rtl2830
blacklist r820t
